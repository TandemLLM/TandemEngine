# Hy4-flash in TandemLLM: the setup guide's registry entry (docs/setup.md). Schema 1.
#
# Tencent's Hy4-flash (engine/models/hy4_flash) in our EXL3 packs, one profile each (ops/profiles/hy4-<bpw>.env), one
# Hugging Face repository a pack with the weights on main. weights_gib: the server's load stage `weights` at
# 262,144 tokens (58.52 on 3.08, 67.17 on 3.56); drafters_gib: the embedded DFly2 layers' stage (0.08); hy4-3.56 adds
# the standalone 3-layer DFly2-B6 (block size 6) EXL3 3.5 drafter and K3 head (hy4-dfly2-b6-3.5). disk_gb: the repository's bytes / 1e9
# with the four Engram tables (40.92 GB, the same files in both packs). table: the Engram tables, read past the page
# cache through a 2 GiB hot-row cache. max_window: both packs were served at 262,144 tokens (the 3.08 pack also filled
# to 262,144 real tokens); the checkpoint reads 1,048,576, which is not tested. Up to 8 lanes, each the full window on
# the KV pool, verified together via CUDA-graphed joint verify and joint burst prefill with QSE_RUNNER_PIPE=1 and 79/81
# GiB memory limits. Quality: our KL runs against the unquantized checkpoint. The measured table is empty: the served
# speeds so far are in the profile notes with their setup.
schema: 1
id: hy4-flash
name: Hy4-flash
family: Hy4
engine: hy_v4_flash
params: ~220B (64B of them Engram tables), ~11B active a token
recommended: false
order: 11
pitch: Tencent's large mixture-of-experts model with Engram n-gram tables on the SSD, in our EXL3 packs, with its
  own DFly2 draft layers.
architecture: 42 layers with latent attention, 30 of them on a sliding window and 12 sparse ones whose indexer picks
  the key groups a token reads; a dense first layer, then a mixture of 512 experts of which 16 and a shared one run
  a token; hyper-connection streams; Engram n-gram tables at four layers (64B of the parameters, read from the SSD
  a row at a time) and five DFly2 draft layers for speculation. It thinks before it answers unless thinking is off.
license: The model's license (Tencent Hy License, Version 1.0, derived from Apache 2.0 with added terms for large
  Model-as-a-Service businesses in its Section 10) is in each pack's LICENSE file and on Tencent's Hugging Face
  page. TandemLLM itself is AGPL-3.0 or commercial.
icon: null

  - ${HOME}/models/hy4-flash-dfly2-b6-exl3-3.0/draft-head-lm_head-k3.safetensors
  fetchable: true
  protected: false
  hf_repo: 0xBakeer/TandemLLM-Hy4-flash-DFly2-B6-EXL3-3.0
  fetch:

profiles:
- id: hy4-3.08
  label: EXL3 3.08 bpw
  format: exl3
  bpw: 3.08
  disk_gb: 103.1
  weights_gib: 58.52
  drafters_gib: 0.08
  hf_repo: 0xBakeer/TandemLLM-Hy4-flash-EXL3-3.0
  hf_private: false
  made_by: {kind: ours, name: 0xBakeer, github: 0xBakeer}
  recommended: false
  badges:
  - smaller
  quality:
    kl_vs_bf16: 0.0989
    top1_pct: 88.52
    ppl: null
    date: '2026-11-19'
    source: 'exllamav3''s cache-less forward with our hy_v4_flash converter patch, the pack against the unquantized
      BF16 checkpoint (revision d88c9dfd) through the same forward, fp16 reference logits, KL(reference || pack) over
      every position. chat2048 (wikitext-2 test rows 70..85 inside a templated no_think turn, 16 x 2,048): KL 0.0989,
      median 0.0287, top-1 88.52 %, reference top-1 in the top 5 99.41 %, perplexity 8.12 for the reference, 8.36 for
      the pack. conv2048 (held-out ultrachat test_sft conversations, 16 x 2,048, 2026-11-20): KL 0.1113, median
      0.0065, top-1 92.11 %, top 5 99.16 %. This engine on the same chat2048 rows: KL 0.1009, top-1 88.49 %. Two
      correct implementations differ by about KL 0.003 to 0.005 on such rows.'
  assets_required: []
  note: 'Served speed, one prose chat request (3,565-token prompt rendered by the pack''s template, thinking off, 600 tokens, greedy, tok/s from token 50, two requests a server, one sequence, --max-len 262,144, idle box, 2026-11-20, both packs in one run): plain 23.78 and 24.12 tok/s,
    drafted (embedded DFly2 + lookup + StairCut over the pack''s price file) 32.08 and 33.02, 237 rounds for 599 tokens; the
    drafted text equals the plain text. First token after 23.6 to 29.6 s on that prompt (before the fixed-order prompt pass).
    Load 86.8 to 93.4 s, 138 to 144 s from start to healthy; profile limits 79 GiB ceiling and 81 GiB peak (ENG-609).
    The standalone DFly2-B6 EXL3 3.0 asset (hy4-dfly2-b6-3.0) is available via QWEN38_HY4_DFLY_MODEL. Not in the measured table''s shape.'
  hf_revision: main
  max_window: 262144
  table:
    gib: 38.11
    policy: cold
    cache_gib: 2.0
- id: hy4-3.56
  label: EXL3 3.56 bpw
  format: exl3
  bpw: 3.56
  disk_gb: 112.38
  weights_gib: 67.17
  drafters_gib: 0.08
  hf_repo: 0xBakeer/TandemLLM-Hy4-flash-EXL3-3.5
  hf_private: false
  made_by: {kind: ours, name: 0xBakeer, github: 0xBakeer}
  recommended: true
  badges:
  - recommended
  quality:
    kl_vs_bf16: 0.0653
    top1_pct: 90.54
    ppl: null
    date: '2026-11-20'
    source: 'exllamav3''s cache-less forward with our hy_v4_flash converter patch, the pack against the unquantized
      BF16 checkpoint (revision d88c9dfd) through the same forward, fp16 reference logits, KL(reference || pack) over
      every position. chat2048 (wikitext-2 test rows 70..85 inside a templated no_think turn, 16 x 2,048): KL 0.0653,
      median 0.0187, top-1 90.54 %, reference top-1 in the top 5 99.58 %, perplexity 8.12 for the reference, 8.32 for
      the pack. conv2048 (held-out ultrachat test_sft conversations, 16 x 2,048): KL 0.0729, median 0.0033, top-1
      93.75 %, top 5 99.42 %. Two correct implementations differ by about KL 0.003 to 0.005 on such rows.'
  assets_required:
  - hy4-dfly2-b6-3.5
  note: 'The default: lower KL on both row sets, served with the standalone 3-layer DFly2-B6 (block size 6) EXL3 3.5 drafter and K3 head,
    CUDA-graphed joint verify and joint burst prefill, QSE_RUNNER_PIPE=1, and 79/81 GiB memory limits (--max-len 262,144, 8 lanes).
    Measured on /v1/completions (cache_prompt: false, thinking off, greedy, 3 rounds, 2026-11-27): single request
    (3,538->600 tokens) 43.33 tok/s median, 3.37 tok/round, 3.76 s first token (940.5 tok/s), identical greedy text in 3 of 3
    runs; 2/4/8 concurrent 256-token requests 47.75 / 60.86 / 76.72 tok/s end-to-end and 51.6 / 63.1 / 81.5 tok/s runner
    steady. Not in the measured table''s shape.'
  hf_revision: main
  max_window: 262144
  table:
    gib: 38.11
    policy: cold
    cache_gib: 2.0
measurements:
  build: 0.16.0
  date: '2026-11-20'
  method: 'not measured: the served speeds so far are one prose chat request each (in the profile notes), not the
    table''s shape'
  source: not measured
  rows: []
memory:
  parts:
  - id: engine
    label: Engine state, the window layers' rings, the draft layers' buffers and graphs
    gib: 1.19
    kind: fixed
    source: 'the load stages on 3.08 at 262,144 tokens (2026-11-20): the engine stage took 5.32 GiB with the window''s
      state, less the state itself (4.13 GiB at 16,896 bytes a token, counted under Conversations)'
  - id: allocator
    label: Allocator reserve
    gib: 1.3
    kind: reserve
    source: 'reserved less allocated after the load on 3.56 at 262,144 tokens, idle box (2026-11-20): 0.83 to 1.26 GiB'
  sources:
  - the server's [memory] load stages on the 3.08 and 3.56 packs at --max-len 262,144 (2026-11-20)
  per_window_parts:
  - id: prefill_workspace
    label: Prefill workspace (a chunk's activations and the indexer's scores)
    bytes_per_token: 29901
    max_gib: 7.3
    kind: reserve
    source: 'the server''s own estimate, 7.3 GiB at 262,144 tokens; not measured (the 262,144-token fill on 3.08 added
      0.4 GiB in the bare engine)'
components:
- id: conductor
  label: Chat (beta)
  group: features
  what: 'On: the Chat tab with its service (chatd) and the conductor, which gives each request the right instructions and helper packages, keeps your memory notes and watches long sessions so they do not get stuck. Off (the default): the engine alone serves its API and the dashboard.'
  default: false
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 0.1
  depends_on: []
  conflicts: []
  knobs:
    CONDUCTOR:
      'on': 'on'
      'off': raw
    QSE_CONDUCTOR_CONFIG:
      'on': ${HOME}/.qwen38-spark-engine/conductor
      'off': 'off'
    QSE_MODE:
      'on': chat
      'off': engine
  assets: []
  docs: docs/server.md
  note: Off (the default), clients talk to the raw engine and the small models below have nothing to do. Not tested
    with this model yet.
- id: narrator
  label: Narrator
  group: roles
  what: A small model that writes short status lines while the big model thinks, so you can see what it is doing.
  default: false
  required: false
  memory_gib: 3.6
  memory_max_gib: null
  elastic: true
  disk_gb: 4.3
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_NARRATOR_MODEL:
      'on': qwen3.5-2b
      'off': ''
    QWEN38_NARRATOR_DIR:
      'on': ${HOME}/.qwen38-spark-engine/models/qwen3.5-2b
      'off': ''
  assets:
  - qwen3.5-2b
  docs: docs/server.md
  note: Qwen3.5-2B, 3.60 GiB in the live memory split. When memory runs short it goes after the shadow reader and
    loads again later.
- id: laya
  label: Laya decision models
  group: roles
  what: Three tiny classifiers that answer the conductor's quick questions, like what kind of request this is, in
    milliseconds.
  default: false
  with_parent: true
  required: false
  memory_gib: 1.6
  memory_max_gib: null
  elastic: false
  disk_gb: 2.3
  depends_on:
  - conductor
  conflicts: []
  knobs:
    QWEN38_DECIDER_MODELS:
      'on': laya-english,laya-multilingual,laya-typed-decisions
      'off': ''
  assets:
  - laya
  docs: docs/server.md
  note: The class question's answer; without them every turn falls back to the profile's default level.
- id: prompt_cache
  label: Conversation cache
  group: caches
  what: Keeps the conversation the model is in, so the next turn starts where the last one ended instead of reading
    everything again.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: 2.5
  elastic: true
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    RESIDENT_GB:
      'on': '2.5'
      'off': '0'
  assets: []
  docs: docs/caches.md
  note: The resident prefix with its anchors every 4,096 tokens; a restore equals a cold prefill. A prompt shorter
    than 4,096 tokens has no anchor and is read again on a repeat. After a restore the first round drafts nothing.
- id: state_store
  label: State store
  group: caches
  what: Saves the model's state after short chats, so the same start a second time costs nothing.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: 2.0
  elastic: true
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    CACHE_GB:
      'on': '2'
      'off': '0'
  assets: []
  docs: docs/caches.md
  note: null
- id: response_cache
  label: Response cache
  group: caches
  what: Answers an identical greedy request again from memory, without running the model.
  default: false
  required: false
  memory_gib: 0.25
  memory_max_gib: null
  elastic: false
  disk_gb: 0.0
  depends_on: []
  conflicts: []
  knobs:
    RESPONSE_CACHE:
      'on': 'on'
      'off': 'off'
  assets: []
  docs: docs/caches.md
  note: Off on the reference box. Useful for scripts that send the same request many times; never for a benchmark.
- id: disk_tier
  label: Disk cache
  group: disk
  what: Keeps the start of long prompts on the SSD, so a long agent session or a returning chat starts in seconds.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 16.0
  depends_on: []
  conflicts: []
  knobs:
    QSE_DISK_CACHE:
      'on': null
      'off': 'off'
  assets: []
  docs: docs/caches.md
  note: A folder of its own per profile (the profile file names it); a file of another fingerprint is swept.
- id: nvme_spill
  label: Session spill
  group: disk
  what: Moves a paused conversation to the SSD instead of dropping it, and brings it back on its next turn.
  default: true
  required: false
  memory_gib: 0.0
  memory_max_gib: null
  elastic: false
  disk_gb: 64.0
  depends_on:
  - disk_tier
  conflicts: []
  knobs:
    SESSION_SPILL:
      'on': 'on'
      'off': 'off'
  assets: []
  docs: docs/caches.md
  note: Compressed, up to SESSION_SPILL_GB (64 GB), inside the disk cache's folder.
parallelism:
  # ENG-485 / SPD-349: 8 lanes on the KV pool, each the full 262,144-token window, verified together in CUDA-graphed
  # joint passes (with packed DFly2 draft graphs and joint burst prefill); measured table rows not recorded yet
  slots:
    min: 1
    max: 8
    default: 8
  window:
    min: 8192
    max: 262144
    default: 262144
    step: 4096
  kv_pool:
    default: true
  floor_gb:
    min: 10
    max: 40
    default: 15
  kv_hard_floor_gb: 10
  kv_bytes_per_token: 16896
  typical_fill_tokens: 32768
  side_slot_const_gib: 0.0
  knobs:
    slots: QSE_PARALLEL
    window: MAX_LEN
    side_window: QSE_SIDE_MAX_LEN
    kv_pool: QSE_KV_POOL
    floor_gb: QSE_PARALLEL_FLOOR_GB
  fixed: {}
methods:
- id: reasoning_effort
  label: Thinking effort
  what: Whether the model thinks before it answers, when a client does not say. On, such a request on the engine
    alone thinks in the model's normal mode with the medium cap of 8,192 tokens; off turns thinking off. A client's own effort is served
    as asked, and only an explicit xhigh or max reaches the model's strongest mode.
  type: enum
  options:
  - value: medium
    label: 'on (normal mode, up to 8,192 thinking tokens)'
  - value: 'off'
    label: 'off'
  default: medium
  recommended: medium
  knob: REASONING_EFFORT
  docs: docs/server.md
- id: default_max_tokens
  label: Default answer length
  what: The longest answer, in tokens, when a client does not set max_tokens.
  type: int
  min: 1024
  max: 262144
  default: 32768
  recommended: 32768
  knob: DEFAULT_MAX_TOKENS
  docs: docs/server.md
- id: request_timeout
  label: Request time limit
  what: Seconds one request may run before the engine stops it.
  type: int
  min: 60
  max: 14400
  default: 3600
  recommended: 3600
  knob: REQUEST_TIMEOUT
  docs: docs/server.md
- id: max_queue
  label: Queue length
  what: How many requests may wait for a free slot before new ones are turned away.
  type: int
  min: 1
  max: 64
  default: 8
  recommended: 8
  knob: MAX_QUEUE
  docs: docs/server.md
- id: queue_timeout
  label: Queue wait
  what: Seconds a request may wait in the queue before it gets an error.
  type: int
  min: 10
  max: 3600
  default: 240
  recommended: 240
  knob: QUEUE_TIMEOUT
  docs: docs/server.md
advanced:
- id: port
  label: Port
  what: The port the API and the dashboard answer on.
  type: int
  min: 1024
  max: 65535
  default: 8000
  recommended: 8000
  knob: PORT
  docs: docs/operations.md
- id: host
  label: Listen on
  what: The whole network, or only this machine.
  type: enum
  options:
  - value: 0.0.0.0
    label: the whole network
  - value: 127.0.0.1
    label: this machine only
  default: 0.0.0.0
  recommended: 0.0.0.0
  knob: HOST
  docs: docs/operations.md
- id: served_model
  label: Raw engine name
  what: The model name of the raw engine. With the conductor on, clients see TandemLLM and this name is a hidden
    alias.
  type: string
  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
  default: qwen38-spark-engine
  recommended: qwen38-spark-engine
  knob: SERVED_MODEL
  docs: docs/server.md
- id: dashboard_login
  label: Dashboard login
  what: With an admin password set, on makes the dashboard ask for it too.
  type: enum
  options:
  - value: 'off'
    label: 'off'
  - value: 'on'
    label: 'on'
  default: 'off'
  recommended: 'off'
  knob: QSE_DASHBOARD_LOGIN
  docs: docs/server.md
- id: admin_password
  label: Admin password
  what: Without one, anyone who reaches the port can change the setup. Generate writes a random one into secrets.env
    on the box; read it there with cat.
  type: enum
  options:
  - value: keep
    label: keep as it is
  - value: generate
    label: generate one
  default: keep
  recommended: keep
  knob: null
  docs: docs/operations.md

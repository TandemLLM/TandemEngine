- label: DFly2-B6 EXL3 3.5
  url: https://huggingface.co/0xBakeer/TandemLLM-Hy4-flash-DFly2-B6-EXL3-3.5
- label: DFly2-B6 EXL3 3.0
  url: https://huggingface.co/0xBakeer/TandemLLM-Hy4-flash-DFly2-B6-EXL3-3.0

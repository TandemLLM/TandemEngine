# The weight packs a gate run can serve (python -m tools.gate run --pack ID). A hardware profile names
# its reference pack (tools/gate/hw/); a run on another pack says so in the report.
#
#   launcher       ops: the arm's tree starts its server with ops/start.sh on the profile below;
#                  fake: server/app.py --fake-engine (no model, no GPU: the gate's own tests)
#   profile        ops/profiles/<profile>.env
#   plain_env      the arm environment that turns speculation off (lossless: spec vs plain)
#   wide_chunk_env the arm environment of the wide prefill chunk case (long suite)
#   hold_word      a word added to the api suite's long requests (the fake's FAKE_LONG: a long answer)
#   burst_word     a word added to the prefill burst's prompts (the fake's FAKE_SLOW_PREFILL: its burst
#                  requests overlap for seconds, so the N-at-once proof holds on a slow runner)
#   proof          what proves N requests decoded at once: `decoding` (the default: the slots in the
#                  server's decode set, /health parallel.decoding) or `running` (the fake engine, whose
#                  writer has no decode phase: the requests running at once)
#   limits         `pack`: the pack sets its own memory limits, and the hardware profile's ceiling and peak are
#                  not passed to its arms (OPS-314; the server's knobs in the report say which won)
#   at_once        the most requests at once a row of this pack's run plans (decode levels, the burst)
#   base           the base side's commit when --base is not given: a family that is not on main yet

fake:
  launcher: fake
  family: fake
  proof: running
  hold_word: ' FAKE_LONG'
  burst_word: ' FAKE_SLOW_PREFILL'

flashnext-3.05:
  launcher: ops
  profile: flashnext-3.05
  family: flashnext
  plain_env: {QSE_ENGINE_FLAGS: '--model ${QSE_WEIGHTS_DIR} --drafter none'}
  wide_chunk_env: {QWEN38_FN_PREFILL_CHUNK: '16384'}

lfm25-exl3-4.0:
  launcher: ops
  profile: lfm25-exl3-4.0
  family: lfm2_moe
  plain_env: {QSE_ENGINE_FLAGS: '--model ${QSE_WEIGHTS_DIR} --drafter none'}

lfm25-exl3-2.5:
  launcher: ops
  profile: lfm25-exl3-2.5
  family: lfm2_moe
  plain_env: {QSE_ENGINE_FLAGS: '--model ${QSE_WEIGHTS_DIR} --drafter none'}

nemotron-bolt-exl3-4.0:
  launcher: ops
  profile: nemotron-bolt-exl3-4.0
  family: nemotron_h
  plain_env: {QSE_ENGINE_FLAGS: '--model ${QSE_WEIGHTS_DIR} --drafter none'}

flint-exl3-4.0:
  launcher: ops
  profile: flint-exl3-4.0
  family: flint
  plain_env: {QSE_ENGINE_FLAGS: '--model ${QSE_WEIGHTS_DIR} --drafter none'}

# OPS-314: Hy4-flash (engine/models/hy4_flash), one entry a pack, both run (SRV-897 point 5). Its profile leaves the
# memory ceiling and peak at serve.env's defaults, and with those its model sets the pack's own from what its load
# holds (serving.py `memory_limits`: 85/92 GiB logged on hy4-3.56 and 77/84 on hy4-3.08 at 262,144 tokens); the
# hardware profile's ceiling and peak would bypass them, so `limits: pack`. The plain arm is speculation off; the
# spec arm drafts with the profile's own `--drafter mtp` (DFly2, the lookup, StairCut). Rows of one request at a
# time until two clients at once are proved on the family (ENG-485). Main has no hy4_flash family until the branch
# merges, so the base side is the branch's 7f2a41f5, the head the program's proofs start from: drop `base` then
hy4-3.56:
  launcher: ops
  profile: hy4-3.56
  family: hy_v4_flash
  plain_env: {QSE_ENGINE_FLAGS: '--model ${QSE_WEIGHTS_DIR} --drafter none'}
  limits: pack
  at_once: 1
  base: 7f2a41f51b9793dcc8fddb30316d8a0161d10072

hy4-3.08:
  launcher: ops
  profile: hy4-3.08
  family: hy_v4_flash
  plain_env: {QSE_ENGINE_FLAGS: '--model ${QSE_WEIGHTS_DIR} --drafter none'}
  limits: pack
  at_once: 1
  base: 7f2a41f51b9793dcc8fddb30316d8a0161d10072
